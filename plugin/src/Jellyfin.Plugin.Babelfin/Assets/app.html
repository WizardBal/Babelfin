<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="same-origin">
    <title>Babelfin Settings</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2300a4dc' d='m12.87%2015.07-2.54-2.51.03-.03c1.74-1.94%202.98-4.17%203.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5%207.92%2010.44%209.75%209%2011.35%208.07%2010.32%207.3%209.19%206.69%208h-2c.73%201.63%201.73%203.17%202.98%204.56l-5.09%205.02L4%2019l5-5%203.11%203.11zM18.5%2010h-2L12%2022h2l1.12-3h4.75L21%2022h2zm-2.62%207%201.62-4.33L19.12%2017z'/%3E%3C/svg%3E">
    <script>
        /* The page is served as-is at {BaseUrl}/Babelfin/app. Its assets load from {BaseUrl}/Babelfin/assets/ without ?v=:
           the server answers them with "no-cache" and a versioned ETag, so a visit after an upgrade always gets the new files
           (a cheap 304 otherwise). app.js asks GET Babelfin/Ping for the version and uses it for the translation files. */
        (function () {
            var path = location.pathname;
            var at = path.toLowerCase().lastIndexOf('/babelfin/app');
            var assets = (at >= 0 ? path.slice(0, at) : '') + '/Babelfin/assets/';
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = assets + 'app.css';
            document.head.appendChild(link);
            ['i18n.js', 'ui.js', 'app.js'].forEach(function (name) {
                var script = document.createElement('script');
                script.src = assets + name;
                script.async = false;
                document.head.appendChild(script);
            });
        })();
    </script>
</head>
<body>
    <div id="bf-app" class="bf-app bfui"></div>
</body>
</html>
